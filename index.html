    <script>
      // Universal polyfill for crypto.randomUUID on insecure HTTP origins (e.g. http://13.247.178.29)
      (function() {
        if (typeof window === 'undefined') return;

        function fallbackUUID() {
          if (typeof window.crypto !== 'undefined' && typeof window.crypto.getRandomValues === 'function') {
            try {
              var buf = new Uint8Array(16);
              window.crypto.getRandomValues(buf);
              buf[6] = (buf[6] & 0x0f) | 0x40;
              buf[8] = (buf[8] & 0x3f) | 0x80;
              var hex = [];
              for (var i = 0; i < 16; i++) {
                var h = buf[i].toString(16);
                hex.push(h.length === 1 ? '0' + h : h);
              }
              var s = hex.join('');
              return s.slice(0, 8) + '-' + s.slice(8, 12) + '-' + s.slice(12, 16) + '-' + s.slice(16, 20) + '-' + s.slice(20);
            } catch (e) {}
          }
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = (Math.random() * 16) | 0;
            var v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
          });
        }

        // 1. Prototype level patch (Firefox / Chromium)
        if (typeof window.Crypto !== 'undefined' && window.Crypto.prototype) {
          try {
            if (typeof window.Crypto.prototype.randomUUID !== 'function') {
              Object.defineProperty(window.Crypto.prototype, 'randomUUID', {
                value: fallbackUUID,
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {
            try { window.Crypto.prototype.randomUUID = fallbackUUID; } catch (e2) {}
          }
        }

        // 2. Instance level patch
        if (!window.crypto) {
          try { window.crypto = {}; } catch (e) {}
        }
        if (window.crypto && typeof window.crypto.randomUUID !== 'function') {
          try {
            Object.defineProperty(window.crypto, 'randomUUID', {
              value: fallbackUUID,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            try { window.crypto.randomUUID = fallbackUUID; } catch (e2) {}
          }
        }

        // 3. Global scope patch
        if (typeof globalThis !== 'undefined') {
          if (!globalThis.crypto) {
            try { globalThis.crypto = window.crypto || {}; } catch (e) {}
          }
          if (globalThis.crypto && typeof globalThis.crypto.randomUUID !== 'function') {
            try {
              Object.defineProperty(globalThis.crypto, 'randomUUID', {
                value: fallbackUUID,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              try { globalThis.crypto.randomUUID = fallbackUUID; } catch (e2) {}
            }
          }
        }
      })();
